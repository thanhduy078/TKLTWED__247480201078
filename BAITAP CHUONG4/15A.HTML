<html>
<head>
<title>Thay đổi thuộc tính</title>

<script>
function CapNhat()
{
    document.title=TieuDe.value;
    document.bgColor=MauNen.value;
    document.fgColor=MauChu.value;
    window.defaultStatus=TrangThai.value;
}
</script>

</head>

<body>

<h2>Nhập các giá trị và nhấn nút Thay đổi</h2>

<input type="text" name="TieuDe" value="Tiêu đề mới"><br>

<input type="text" name="MauNen" value="blue"><br>

<input type="text" name="MauChu" value="white"><br>

<input type="text" name="TrangThai" value="Dòng trạng thái"><br>

<input type="button" value="Thay đổi"
onclick="CapNhat();">

</body>
</html>
