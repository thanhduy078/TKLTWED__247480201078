<html>
<head>
<title>Chọn màu nền</title>
</head>
<body>

<h2>Bạn hãy chọn màu nền:</h2>

<select name="Mau"
onchange="document.bgColor=Mau.value;">
    <option value="blue">Màu xanh</option>
    <option value="green">Màu xanh lá</option>
    <option value="yellow">Màu vàng</option>
    <option value="brown">Màu nâu</option>
</select>

</body>
</html>
