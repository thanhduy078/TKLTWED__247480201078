<html>
<head>

<meta http-equiv="Content-Type"
content="text/html; charset=utf-8">

<script>
function KiemTra()
{
    if(NoiDung.value.length>200)
        alert("Bạn đã gõ quá số ký tự cho phép!");

    SoKyTu.value=NoiDung.value.length;
}
</script>

</head>

<body>

Số ký tự đã gõ:
<input type="text" name="SoKyTu">

<br>

<textarea name="NoiDung"
cols="50" rows="10"
onkeyup="KiemTra();"></textarea>

</body>
</html>
