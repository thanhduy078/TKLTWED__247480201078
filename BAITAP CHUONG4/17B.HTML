<html>
<head>
<title>Chọn màu</title>
</head>

<body>

<script>
function DoiMau()
{
    document.bgColor=Mau.value;
}
</script>

Bạn hãy chọn màu nền:

<input type="radio" name="Mau" value="yellow"
onclick="DoiMau();"> Vàng

<input type="radio" name="Mau" value="green"
onclick="DoiMau();"> Xanh lá

<input type="radio" name="Mau" value="brown"
onclick="DoiMau();"> Nâu

<input type="radio" name="Mau" value="lavender"
onclick="DoiMau();"> Xanh nhạt

</body>
</html>
