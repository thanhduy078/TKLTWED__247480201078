<body>

<h2 id="demo">JavaScript DOM</h2>

<p class="para">HTML</p>
<p class="para">CSS</p>

<ul>
    <li>Word</li>
    <li>Excel</li>
</ul>

<script>
    // 1. Finding by ID
    document.getElementById("demo").innerHTML = "Hello JavaScript";

    // 2. Finding by Tag Name
    var a = document.getElementsByTagName("li");
    a[0].innerHTML = "Soạn thảo văn bản";

    // 3. Finding by Class Name
    var b = document.getElementsByClassName("para");
    b[0].style.color = "red";
    b[1].style.color = "blue";

    // 4. Finding by CSS Selectors
    document.querySelector("h2").style.color = "green";

    // 5. Finding by HTML Object Collections
    document.images;
    document.forms;
    document.links;
</script>

</body>
