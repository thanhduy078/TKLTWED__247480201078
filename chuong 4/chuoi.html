<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 4.7.1 Khai bao chuoi
        var str = "Day la mot chuoi JavaScript";
        document.write(str + "<br>");
    
        // 4.7.2 Cach 2
        var stringname = new String("Hello JS string");
        document.write(stringname + "<br>");
    
        // 4.7.3 Cac phuong thuc xu ly chuoi
    
        var str = "javascript";
        document.write(str.charAt(2) + "<br>");
    
        var s1 = "Java";
        var s2 = "Script";
        var s3 = s1.concat(s2);
        document.write(s3 + "<br>");
    
        var s1 = "JavaScript";
        var n = s1.indexOf("Script");
        document.write(n + "<br>");
    
        var s1 = "Nguyen Huy";
        var n = s1.lastIndexOf("uy");
        document.write(n + "<br>");
    
        var s1 = "JavaScript";
        var s2 = s1.toLowerCase();
        document.write(s2 + "<br>");
    
        var s1 = "JavaScript";
        var s2 = s1.toUpperCase();
        document.write(s2 + "<br>");
    
        var s1 = "JavaScript";
        var s2 = s1.slice(3, 5);
        document.write(s2 + "<br>");
    
        var s1 = "    javascript trim    ";
        var s2 = s1.trim();
        document.write(s2);
    </script>
</body>
</html>
