<html>
<head>
<title>Đăng ký thể thao</title>
</head>
<body>
<fieldset>
<legend>Đăng ký thể thao</legend>

<h3>TRƯỜNG ĐẠI HỌC BẠC LIÊU</h3>
<h3 align="center">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</h3>
<p align="center">Độc lập - Tự do - Hạnh phúc</p>

<h2 align="center">PHIẾU ĐĂNG KÝ DỰ THI THỂ THAO</h2>

<form>
Họ tên:
<input type="text"><br><br>

Mật khẩu:
<input type="password"><br><br>

<b>Môn thể thao:</b><br>
<input type="checkbox"> Bóng đá<br>
<input type="checkbox"> Bóng chuyền<br>
<input type="checkbox"> Điền kinh<br>
<input type="checkbox"> Bơi lội<br><br>

<hr>
<h2 align="center">PHẦN CỨNG MÁY TÍNH</h2>

<b>Thiết bị:</b><br>
<select multiple>
<option>CPU</option>
<option>Mainboard</option>
<option>ASUS DVD</option>
<option>RAM KingMax</option>
</select>

<br><br>
Thời gian bảo hành:<br>
<select>
<option>6 tháng</option>
<option>12 tháng</option>
<option>24 tháng</option>
</select>

<br><br>
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</form>

</fieldset>
</body>
</html>
